name: Billing Guard Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  billing-guard:
    name: Billing constant & formula guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run billing guard tests
        run: pnpm test
