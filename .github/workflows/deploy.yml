name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/fullswap-api
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/fullswap-frontend

jobs:
  # ── 1. Build & push Docker images to GitHub Container Registry ──────────────
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to Railway (if RAILWAY_TOKEN secret is configured) ─────────────
  deploy-railway:
    name: Deploy to Railway
    needs: build
    runs-on: ubuntu-latest
    # Use env var to check secret presence — secrets context is not available in if:
    env:
      HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' && 'true' || 'false' }}
    if: ${{ always() && needs.build.result == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway
        if: ${{ env.HAS_RAILWAY_TOKEN == 'true' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          npm install -g @railway/cli
          railway up --service api --service frontend

      - name: Skip (RAILWAY_TOKEN not configured)
        if: ${{ env.HAS_RAILWAY_TOKEN != 'true' }}
        run: echo "RAILWAY_TOKEN secret not set — skipping Railway deploy."

  # ── 3. Deploy to VPS via SSH (if VPS_HOST variable is configured) ────────────
  deploy-vps:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build.result == 'success' && vars.VPS_HOST != '' }}

    steps:
      - name: Checkout (for docker-compose.yml + nginx config)
        uses: actions/checkout@v4

      - name: Copy config files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,nginx/"
          target: "/opt/fullswap"

      - name: Pull latest images & restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/fullswap

            # Log in to GHCR on the VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Update image tags in compose to use the exact SHA for this deploy
            export IMAGE_API=${{ env.IMAGE_API }}:${{ github.sha }}
            export IMAGE_FRONTEND=${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

            # Pull and recreate only changed services
            docker compose pull api frontend
            docker compose up -d --no-build

            # Clean up old images
            docker image prune -f

            echo "Deployed commit ${{ github.sha }}"
