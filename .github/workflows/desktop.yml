name: Build Desktop App

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      # macOS code signing (skip if certs not configured)
      - name: Build desktop app (macOS)
        if: matrix.platform == 'mac'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # set to true + add certs to sign
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_SERVER_URL: ${{ vars.APP_SERVER_URL || 'https://your-domain.com' }}
        run: npm run build:mac

      - name: Build desktop app (Windows)
        if: matrix.platform == 'win'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_SERVER_URL: ${{ vars.APP_SERVER_URL || 'https://your-domain.com' }}
        run: npm run build:win

      - name: Build desktop app (Linux)
        if: matrix.platform == 'linux'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_SERVER_URL: ${{ vars.APP_SERVER_URL || 'https://your-domain.com' }}
        run: npm run build:linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: ignore

      # Attach to GitHub Release if triggered by a release event
      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
