[phases.setup]
  nixPkgs = ["nodejs_22"]

  [phases.install]
  cmds = [
    "npm install -g pnpm@9 && export PATH=$(npm prefix -g)/bin:$PATH && pnpm install --no-frozen-lockfile"
  ]

  [phases.build]
  cmds = ["export PATH=$(npm prefix -g)/bin:$PATH && pnpm run build:railway"]

  [start]
  cmd = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
  