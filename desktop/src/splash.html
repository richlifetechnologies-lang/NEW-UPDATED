<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-app-region: drag;
    }
    .card {
      background: #0a0f1a;
      border: 1px solid hsl(187 100% 52% / 0.4);
      border-radius: 16px;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 0 0 40px hsl(187 100% 52% / 0.15);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: hsl(187 100% 52%);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    p {
      font-size: 11px;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .bar {
      width: 200px;
      height: 2px;
      background: #1e293b;
      border-radius: 2px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      background: hsl(187 100% 52%);
      animation: load 1.6s ease-in-out infinite;
    }
    @keyframes load {
      0%   { width: 0%; margin-left: 0; }
      50%  { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Full Swap By Rich</h1>
    <p>AI Face Swap Studio</p>
    <div class="bar"><div class="fill"></div></div>
  </div>
</body>
</html>
