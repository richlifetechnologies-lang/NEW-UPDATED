<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-app-region: drag;
      overflow: hidden;
    }
    .card {
      background: linear-gradient(145deg, #0a0f1a 0%, #0d1b2a 100%);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 20px;
      padding: 44px 64px;
      text-align: center;
      box-shadow:
        0 0 60px rgba(0, 229, 255, 0.08),
        0 0 120px rgba(0, 229, 255, 0.04),
        0 20px 60px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(0,229,255,0.04) 0%, transparent 65%);
      animation: rotateBg 8s linear infinite;
    }
    @keyframes rotateBg {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .glow-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(0,229,255,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      position: relative;
      animation: ringPulse 2s ease-in-out infinite;
    }
    .glow-ring::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(0,229,255,0.2);
      animation: ringPulse 2s ease-in-out infinite 0.3s;
    }
    @keyframes ringPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0,229,255,0.3), 0 0 20px rgba(0,229,255,0.1); }
      50%       { box-shadow: 0 0 0 8px rgba(0,229,255,0), 0 0 40px rgba(0,229,255,0.2); }
    }
    .ring-inner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle, #00e5ff 0%, #0098b3 100%);
      box-shadow: 0 0 16px rgba(0,229,255,0.8);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 4px;
      position: relative;
    }
    .accent {
      color: #00e5ff;
    }
    p {
      font-size: 10px;
      color: #475569;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
      position: relative;
    }
    .bar-wrap {
      width: 220px;
      margin: 0 auto 16px;
      position: relative;
    }
    .bar {
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #00e5ff, #00b8d9, #00e5ff, transparent);
      background-size: 200% 100%;
      animation: shimmer 1.8s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%   { width: 0%;  margin-left: 0%;   background-position: 200% 0; }
      40%  { width: 70%; margin-left: 10%;  background-position: 0% 0; }
      100% { width: 0%;  margin-left: 100%; background-position: -200% 0; }
    }
    .version {
      font-size: 10px;
      color: #1e3a4a;
      letter-spacing: 1px;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="glow-ring"><div class="ring-inner"></div></div>
    <h1>FULL SWAP <span class="accent">BY RICH</span></h1>
    <p>AI Face Swap Studio</p>
    <div class="bar-wrap">
      <div class="bar"><div class="fill"></div></div>
    </div>
    <div class="version">v1.0.15 &nbsp;·&nbsp; Loading...</div>
  </div>
</body>
</html>
