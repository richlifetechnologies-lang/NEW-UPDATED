upstream api {
    server api:8080;
    keepalive 32;
}

# ── HTTP (redirect to HTTPS if certs are present, otherwise serve directly) ──
server {
    listen 80;
    server_name _;

    # Health check — let load balancers reach this without redirect
    location /api/healthz {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Uncomment the block below and comment out the rest of this server block
    # once you have TLS certificates in nginx/certs/
    # return 301 https://$host$request_uri;

    # ── API proxy ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Allow large uploads (profile images, etc.)
        client_max_body_size 20m;

        # SSE / long-poll support — disable buffering for streaming endpoints
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Static frontend ──────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}

